<!-- Language: HTML -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — Smart Hostel Finder</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="dash-header">
    <a href="dashboard.html" class="logo">
      <span class="badge">S</span>
      SmartHostel
    </a>
    <div class="welcome">
      Welcome, <strong id="userName">…</strong>
    </div>
    <button class="btn btn-outline" id="logoutBtn">Log out</button>
  </header>

  <section class="section">
    <h2>Find your next hostel</h2>

    <form class="filters" id="filterForm">
      <input type="text" id="regionInput" placeholder="Region (e.g. Legon)" />
      <select id="roomTypeInput">
        <option value="">Any room type</option>
        <option value="1 in a room">1 in a room</option>
        <option value="2 in a room">2 in a room</option>
        <option value="4 in a room">4 in a room</option>
      </select>
      <input type="number" id="maxPriceInput" placeholder="Max price (GH₵/year)" />
      <button type="submit" class="btn btn-primary">Filter</button>
    </form>

    <div class="hostel-grid" id="hostelGrid">
      <p class="empty-state">Loading hostels…</p>
    </div>
  </section>

  <script src="js/api.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
