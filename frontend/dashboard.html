<!-- Language: HTML -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirecting… — Smart Hostel Finder</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!--
    This page exists ONLY as a compatibility redirector, so that any
    existing link to "dashboard.html" (logos, back-to-dashboard messages,
    etc.) keeps working without needing to be tracked down individually.
    It immediately sends each signed-in role to their own dedicated
    dashboard — students never see this page's content, since the
    redirect happens before anything renders.
  -->
  <section class="section">
    <p class="empty-state">Redirecting…</p>
  </section>

  <script src="js/api.js"></script>
  <script src="js/role-redirect.js"></script>
  <script>
    if (!isLoggedIn()) {
      window.location.href = 'signin.html';
    } else {
      redirectToRoleDashboard(currentUser().role);
    }
  </script>
</body>
</html>
