<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Inbox — HostelScout</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav class="navbar">
    <a href="student-dashboard.html" class="logo">
      <span class="badge"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5 11 5l4 3.2"/><path d="M6 9.5V18a1 1 0 0 0 1 1h4v-4h1"/><circle cx="16.5" cy="16.5" r="3.2"/><path d="m19 19 2 2"/></svg></span>
      HostelScout
    </a>
    <a class="back-link" onclick="history.back()">← Back</a>
  </nav>
  <section class="section" style="max-width: 900px;">
    <h2>My Inbox</h2>
    <div style="display:flex; gap:20px; margin-top:20px;">
      <div id="conversationList" style="width:280px; flex-shrink:0; border:1px solid var(--border); border-radius:12px; overflow:hidden; background:white; max-height:600px; overflow-y:auto;">
        <p class="empty-state" style="padding:16px;">Loading…</p>
      </div>
      <div id="messageThread" style="flex:1; border:1px solid var(--border); border-radius:12px; background:white; display:flex; flex-direction:column; min-height:500px;">
        <p class="empty-state" style="padding:40px; margin:auto;">Select a conversation to view messages.</p>
      </div>
    </div>
  </section>
  <script src="js/api.js"></script>
  <script src="js/role-redirect.js"></script>
  <script src="js/inbox.js"></script>
</body>
</html>
