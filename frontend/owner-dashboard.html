<!-- Language: HTML -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Smart Hostel Finder — Hostel Owner Portal</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="dash-header">
    <a href="owner-dashboard.html" class="logo">
      <span class="badge">S</span>
      SmartHostel <span style="font-weight:400; font-size:13px; color:var(--text-muted);">— Hostel Owner Portal</span>
    </a>
    <a class="back-link" onclick="history.back()">← Back</a>
    <div class="welcome">
      Welcome, <strong id="userName">…</strong>
    </div>
    <a href="explore.html" class="btn btn-outline">Browse hostels</a>
    <a href="add-hostel.html" class="btn btn-primary">+ Add hostel</a>
    <div style="position:relative;">
      <button type="button" id="notificationBell" class="btn btn-outline" style="position:relative;">
        🔔
        <span id="notificationBadge" style="display:none; position:absolute; top:-6px; right:-6px; background:#B3261E; color:white; font-size:11px; font-weight:700; border-radius:10px; padding:1px 6px;"></span>
      </button>
      <div id="notificationDropdown" style="display:none; position:absolute; right:0; top:calc(100% + 6px); width:320px; max-height:400px; overflow-y:auto; background:white; border:1px solid var(--border); border-radius:10px; box-shadow:0 8px 24px rgba(0,0,0,0.12); z-index:100;"></div>
    </div>
    <a href="owner-profile.html" class="btn btn-outline">My Profile</a>
    <button class="btn btn-outline" id="logoutBtn">Log out</button>
  </header>

  <section class="section">
    <h2>My hostels</h2>
    <p style="color: var(--text-muted);">Manage the listings you own. Students never see this page — it's only reachable through the owner portal.</p>
    <div id="myHostelsList"><p class="empty-state">Loading your hostels…</p></div>
  </section>

  <script src="js/api.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/role-redirect.js"></script>
  <script src="js/geocode-client.js"></script>
  <script src="js/owner-dashboard.js"></script>
  <script>initNotificationBell();</script>
</body>
</html>
