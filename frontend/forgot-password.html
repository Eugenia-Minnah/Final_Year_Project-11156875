<!-- Language: HTML -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot password — HostelScout</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="logo">
      <span class="badge"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5 11 5l4 3.2"/><path d="M6 9.5V18a1 1 0 0 0 1 1h4v-4h1"/><circle cx="16.5" cy="16.5" r="3.2"/><path d="m19 19 2 2"/></svg></span>
      HostelScout
    </a>
    <a class="back-link" onclick="history.back()">← Back</a>
  </nav>

  <div class="auth-split">
    <div class="auth-visual" style="background-image: url('images/auth-photo.jpg')"></div>
    <div class="auth-form-side">
    <div class="auth-card">
      <h1>Reset your password</h1>
      <p class="sub">Enter your email and we'll generate a reset link for you.</p>

      <div class="error-msg" id="errorMsg"></div>
      <div class="error-msg" id="successMsg" style="background:#E4F3EF; color:var(--green-dark);"></div>

      <form id="forgotForm">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" required placeholder="you@example.com" />
        </div>
        <button type="submit" class="btn btn-primary full-width">Send reset link</button>
      </form>

      <p class="auth-switch"><a href="student-login.html">Back to sign in</a></p>
    </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    document.getElementById('forgotForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorBox = document.getElementById('errorMsg');
      const successBox = document.getElementById('successMsg');
      errorBox.style.display = 'none';
      successBox.style.display = 'none';

      try {
        const data = await apiRequest('/api/auth/forgot-password', {
          method: 'POST',
          body: { email: document.getElementById('email').value },
        });
        successBox.textContent = data.message + ' Please check your inbox (and spam folder) for the link.';
        successBox.style.display = 'block';
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.style.display = 'block';
      }
    });
  </script>
</body>
</html>
