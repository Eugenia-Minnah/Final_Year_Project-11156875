<!-- Language: HTML -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot password — Smart Hostel Finder</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="logo">
      <span class="badge">S</span>
      SmartHostel
    </a>
    <a class="back-link" onclick="history.back()">← Back</a>
  </nav>

  <div class="auth-wrapper">
    <div class="auth-card">
      <h1>Reset your password</h1>
      <p class="sub">Enter your email and we'll generate a reset link for you.</p>

      <div class="error-msg" id="errorMsg"></div>
      <div class="error-msg" id="successMsg" style="background:#E4F3EF; color:var(--green-dark);"></div>

      <form id="forgotForm">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" required placeholder="you@example.com" />
        </div>
        <button type="submit" class="btn btn-primary full-width">Send reset link</button>
      </form>

      <p class="auth-switch"><a href="signin.html">Back to sign in</a></p>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    document.getElementById('forgotForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorBox = document.getElementById('errorMsg');
      const successBox = document.getElementById('successMsg');
      errorBox.style.display = 'none';
      successBox.style.display = 'none';

      try {
        const data = await apiRequest('/api/auth/forgot-password', {
          method: 'POST',
          body: { email: document.getElementById('email').value },
        });
        successBox.textContent = data.message + ' (For now, check your backend terminal for the link — real email sending isn\'t set up yet.)';
        successBox.style.display = 'block';
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.style.display = 'block';
      }
    });
  </script>
</body>
</html>
