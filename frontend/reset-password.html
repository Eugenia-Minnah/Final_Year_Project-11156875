<!-- Language: HTML -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Set new password — Smart Hostel Finder</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="logo">
      <span class="badge">S</span>
      SmartHostel
    </a>
    <a class="back-link" onclick="history.back()">← Back</a>
  </nav>

  <div class="auth-wrapper">
    <div class="auth-card">
      <h1>Set a new password</h1>
      <p class="sub">Choose a new password for your account.</p>

      <div class="error-msg" id="errorMsg"></div>

      <form id="resetForm">
        <div class="field">
          <label for="newPassword">New password</label>
          <input type="password" id="newPassword" required minlength="6" placeholder="At least 6 characters" />
        </div>
        <div class="field">
          <label for="confirmPassword">Confirm new password</label>
          <input type="password" id="confirmPassword" required minlength="6" placeholder="Re-enter password" />
        </div>
        <button type="submit" class="btn btn-primary full-width">Update password</button>
      </form>

      <p class="auth-switch"><a href="signin.html">Back to sign in</a></p>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    const token = new URLSearchParams(window.location.search).get('token');
    const errorBox = document.getElementById('errorMsg');

    if (!token) {
      errorBox.textContent = 'This reset link is missing its token. Please request a new one from the Forgot Password page.';
      errorBox.style.display = 'block';
    }

    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.style.display = 'none';

      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (newPassword !== confirmPassword) {
        errorBox.textContent = 'Passwords do not match.';
        errorBox.style.display = 'block';
        return;
      }

      try {
        await apiRequest('/api/auth/reset-password', {
          method: 'POST',
          body: { token, newPassword },
        });
        alert('Password updated! Please sign in with your new password.');
        window.location.href = 'signin.html';
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.style.display = 'block';
      }
    });
  </script>
</body>
</html>
