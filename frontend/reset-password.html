<!-- Language: HTML -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Set new password — HostelScout</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="logo">
      <span class="badge"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5 11 5l4 3.2"/><path d="M6 9.5V18a1 1 0 0 0 1 1h4v-4h1"/><circle cx="16.5" cy="16.5" r="3.2"/><path d="m19 19 2 2"/></svg></span>
      HostelScout
    </a>
    <a class="back-link" onclick="history.back()">← Back</a>
  </nav>

  <div class="auth-split">
    <div class="auth-visual" style="background-image: url('images/auth-photo.jpg')"></div>
    <div class="auth-form-side">
    <div class="auth-card">
      <h1>Set a new password</h1>
      <p class="sub">Choose a new password for your account.</p>

      <div class="error-msg" id="errorMsg"></div>

      <form id="resetForm">
        <div class="field">
          <label for="newPassword">New password</label>
          <input type="password" id="newPassword" required minlength="6" placeholder="At least 6 characters" />
        </div>
        <div class="field">
          <label for="confirmPassword">Confirm new password</label>
          <input type="password" id="confirmPassword" required minlength="6" placeholder="Re-enter password" />
        </div>
        <button type="submit" class="btn btn-primary full-width">Update password</button>
      </form>

      <p class="auth-switch"><a href="student-login.html">Back to sign in</a></p>
    </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    const token = new URLSearchParams(window.location.search).get('token');
    const errorBox = document.getElementById('errorMsg');

    if (!token) {
      errorBox.textContent = 'This reset link is missing its token. Please request a new one from the Forgot Password page.';
      errorBox.style.display = 'block';
    }

    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.style.display = 'none';

      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (newPassword !== confirmPassword) {
        errorBox.textContent = 'Passwords do not match.';
        errorBox.style.display = 'block';
        return;
      }

      try {
        await apiRequest('/api/auth/reset-password', {
          method: 'POST',
          body: { token, newPassword },
        });
        alert('Password updated! Please sign in with your new password.');
        window.location.href = 'student-login.html';
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.style.display = 'block';
      }
    });
  </script>
</body>
</html>
