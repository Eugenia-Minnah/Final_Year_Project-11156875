<!-- Language: HTML -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hostel Owner Login — HostelScout</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="logo">
      <span class="badge"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5 11 5l4 3.2"/><path d="M6 9.5V18a1 1 0 0 0 1 1h4v-4h1"/><circle cx="16.5" cy="16.5" r="3.2"/><path d="m19 19 2 2"/></svg></span>
      HostelScout <span style="font-weight:400; font-size:13px; color:var(--text-muted);">— Owner Portal</span>
    </a>
    <a class="back-link" onclick="history.back()">← Back</a>
  </nav>

  <div class="auth-split">
    <div class="auth-visual" style="background-image: url('images/auth-photo.jpg')"></div>
    <div class="auth-form-side">
    <div class="auth-card">
      <h1>Hostel Owner Login</h1>
      <p class="sub">Sign in to manage your hostel listings, rooms, and availability.</p>

      <div class="error-msg" id="errorMsg"></div>

      <form id="signinForm" data-expected-role="owner">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" required placeholder="you@example.com" />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" required placeholder="••••••••" />
          <div style="text-align: right; margin-top: 6px;">
            <a href="forgot-password.html" style="font-size: 13px; color: var(--green); font-weight: 600;">Forgot password?</a>
          </div>
        </div>
        <button type="submit" class="btn btn-primary full-width">Sign in to Owner Portal</button>
      </form>

      <p class="auth-switch">New hostel owner? <a href="signup.html?role=owner">List your hostel</a></p>
      <p class="auth-switch" style="margin-top:6px;">Looking for a hostel to live in? <a href="student-login.html">Student Sign In</a></p>
    </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/role-redirect.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
