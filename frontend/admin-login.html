<!-- Language: HTML -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — Smart Hostel Finder</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="logo">
      <span class="badge">S</span>
      SmartHostel <span style="font-weight:400; font-size:13px; color:var(--text-muted);">— Admin</span>
    </a>
    <a class="back-link" onclick="history.back()">← Back</a>
  </nav>

  <div class="auth-wrapper">
    <div class="auth-card">
      <h1>Admin Login</h1>
      <p class="sub">For platform administrators only.</p>

      <div class="error-msg" id="errorMsg"></div>

      <form id="signinForm" data-expected-role="admin">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" required placeholder="you@example.com" />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" required placeholder="••••••••" />
        </div>
        <button type="submit" class="btn btn-primary full-width">Sign in</button>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/role-redirect.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
